<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runner Shortcut Hub</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/themes/lost-starship.css">
    <link rel="stylesheet" href="styles/themes/liquid-glass.css">
    <link rel="stylesheet" href="styles/themes/custom.css">
    <link rel="stylesheet" href="styles/v2.css">
    <link rel="stylesheet" href="styles/themes/minimal.css">
  </head>
  <body>
    <main class="shell">
      <nav id="globalRail" class="global-rail" aria-label="">
        <button id="railHomeBtn" class="rail-button is-active" type="button" data-rail-action="home">
          <span aria-hidden="true">⌂</span>
        </button>
        <button id="railSearchBtn" class="rail-button" type="button" data-rail-action="search">
          <span aria-hidden="true">⌕</span>
        </button>
        <button id="railCategoriesBtn" class="rail-button" type="button" data-rail-action="categories">
          <span aria-hidden="true">▦</span>
        </button>
        <span class="rail-spacer" aria-hidden="true"></span>
        <button id="railCustomizeBtn" class="rail-button" type="button" data-rail-action="customize">
          <span aria-hidden="true">⚙</span>
        </button>
      </nav>

      <section id="topbar" class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p id="brandKicker" class="kicker"></p>
            <h1 id="brandTitle"></h1>
            <p id="todayText"></p>
          </div>
        </div>

        <form id="searchForm" class="search" autocomplete="off">
          <label id="searchInputLabel" class="sr-only" for="searchInput"></label>
          <span id="searchPrefix" class="search-prefix"></span>
          <input id="searchInput" type="text" autofocus>
          <button id="searchEngineBtn" class="engine-toggle" type="button"></button>
          <button id="searchClearBtn" class="search-clear" type="button" hidden>×</button>
          <button id="historyToggleBtn" class="history-toggle" type="button" aria-pressed="true"></button>
          <button id="searchSubmitBtn" class="search-submit" type="submit"></button>
          <div id="searchHistoryPanel" class="search-history-panel" hidden>
            <div class="search-history-head">
              <span id="searchPanelTitle"></span>
              <div>
                <button id="clearHistoryBtn" type="button"></button>
                <button id="hideHistoryBtn" type="button"></button>
              </div>
            </div>
            <div id="searchSuggestionList" class="search-history-list"></div>
          </div>
        </form>

        <div id="systemPanel" class="system-panel">
          <span id="signalLabel"></span>
          <strong id="shortcutTotal">0</strong>
          <span id="clustersStatLabel"></span>
          <strong id="categoryTotal">0</strong>
          <button id="nativeHomeBtn" class="lang-toggle native-toggle" type="button"></button>
          <button id="languageToggleBtn" class="lang-toggle language-toggle" type="button"></button>
          <button id="customizeBtn" class="lang-toggle customize-toggle" type="button"></button>
        </div>
      </section>

      <section class="workspace">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-head">
            <span id="clustersLabel"></span>
            <button id="addCategoryBtn" class="icon-button" type="button">+</button>
          </div>
          <nav id="categoryList" class="category-list"></nav>
        </aside>

        <section class="content" aria-live="polite">
          <div class="content-head">
            <div>
              <p id="panelEyebrow" class="eyebrow"></p>
              <h2 id="activeCategoryName"></h2>
            </div>
            <div class="actions">
              <button id="editCategoryBtn" class="ghost-button" type="button"></button>
              <button id="addShortcutBtn" class="primary-button" type="button"></button>
            </div>
          </div>

          <div id="shortcutGrid" class="shortcut-grid"></div>
          <p id="emptyState" class="empty-state" hidden></p>
        </section>
      </section>

      <footer class="system-footer" aria-live="polite">
        <span id="footerProduct">Runner Shortcut Hub</span>
        <span id="footerStatus"></span>
        <span id="footerTheme"></span>
        <span id="footerVersion">v2.2.2</span>
      </footer>

      <section id="classicHome" class="classic-home" hidden>
        <div class="classic-toolbar">
          <button id="runnerHomeBtn" class="classic-button" type="button"></button>
          <button id="classicLanguageBtn" class="classic-button" type="button"></button>
        </div>

        <div class="classic-logo" aria-hidden="true">Google</div>
        <form id="classicSearchForm" class="classic-search" autocomplete="off">
          <label id="classicSearchInputLabel" class="sr-only" for="classicSearchInput"></label>
          <span class="classic-plus">+</span>
          <input id="classicSearchInput" type="text">
          <button type="submit"></button>
        </form>
        <div id="classicShortcutGrid" class="classic-shortcuts"></div>
      </section>
    </main>

    <dialog id="focusSearchDialog" class="modal focus-search-modal">
      <div class="modal-head focus-search-head">
        <div>
          <p id="focusSearchEyebrow" class="eyebrow"></p>
          <h3 id="focusSearchDialogTitle"></h3>
        </div>
        <button id="closeFocusSearchBtn" class="icon-button close-dialog" type="button" value="cancel">×</button>
      </div>
      <div class="focus-search-body">
        <label id="focusSearchInputLabel" class="sr-only" for="focusSearchInput"></label>
        <div class="focus-search-field">
          <span class="focus-search-glyph" aria-hidden="true">⌕</span>
          <input
            id="focusSearchInput"
            type="search"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="focusSearchResults"
            aria-expanded="false"
          >
          <button id="clearFocusSearchBtn" class="focus-search-clear" type="button" hidden>×</button>
        </div>
        <p id="focusSearchStatus" class="focus-search-status" aria-live="polite"></p>
        <div id="focusSearchResults" class="focus-search-results" role="listbox"></div>
      </div>
    </dialog>

    <dialog id="categoryDialog" class="modal">
      <form id="categoryForm" method="dialog" novalidate>
        <div class="modal-head">
          <h3 id="categoryDialogTitle"></h3>
          <button class="icon-button close-dialog" type="button" value="cancel">×</button>
        </div>
        <input type="hidden" id="categoryId">
        <label>

          <input id="categoryNameInput" type="text" maxlength="24" required>
        </label>
        <label>

          <input id="categoryIconInput" type="text" maxlength="4">
        </label>
        <div class="category-icon-editor">
          <div id="categoryIconPreview" class="category-icon category-icon-preview">AI</div>
          <div>
            <p id="categoryIconImageTitle" class="preview-title"></p>
            <p id="categoryIconImageCopy" class="preview-copy"></p>
          </div>
          <input id="categoryIconFileInput" type="file" accept="image/*" hidden>
          <button id="uploadCategoryIconBtn" class="ghost-button" type="button"></button>
          <button id="removeCategoryIconBtn" class="ghost-button" type="button"></button>
        </div>
        <p id="categoryError" class="form-error" hidden></p>
        <div class="modal-actions">
          <button id="moveCategoryUpBtn" class="ghost-button" type="button" hidden></button>
          <button id="moveCategoryDownBtn" class="ghost-button" type="button" hidden></button>
          <button id="deleteCategoryBtn" class="danger-button" type="button" hidden></button>
          <span class="spacer"></span>
          <button id="cancelCategoryBtn" class="ghost-button close-dialog" type="button"></button>
          <button id="saveCategoryBtn" class="primary-button" type="submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="searchEngineDialog" class="modal search-engine-modal">
      <div class="modal-head">
        <h3 id="searchEngineDialogTitle"></h3>
        <button class="icon-button close-dialog" type="button" value="cancel">×</button>
      </div>
      <div id="searchEngineList" class="search-engine-list" role="list"></div>
      <form id="searchEngineForm" method="dialog" class="search-engine-form" novalidate>
        <div class="form-section-head">
          <h4 id="searchEngineFormTitle"></h4>
          <button id="newSearchEngineBtn" class="ghost-button compact-button" type="button"></button>
        </div>
        <input id="searchEngineId" type="hidden">
        <label>

          <input id="searchEngineNameInput" type="text" maxlength="32" required>
        </label>
        <label>

          <input id="searchEngineShortcutInput" type="text" maxlength="8" placeholder="AI">
        </label>
        <label>

          <input id="searchEngineUrlInput" type="url" required>
        </label>
        <p id="searchEngineTemplateHelp" class="preview-copy"></p>
        <p id="searchEngineError" class="form-error" hidden></p>
        <div class="modal-actions">
          <button id="deleteSearchEngineBtn" class="danger-button" type="button" hidden></button>
          <span class="spacer"></span>
          <button id="cancelSearchEngineBtn" class="ghost-button" type="button"></button>
          <button id="saveSearchEngineBtn" class="primary-button" type="submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="customizeDialog" class="modal customize-modal">
      <div class="modal-head">
        <h3 id="customizeDialogTitle"></h3>
        <button class="icon-button close-dialog" type="button" value="cancel">×</button>
      </div>

      <div class="customize-body">
        <section class="customize-section design-theme-section">
          <div class="customize-section-heading">
            <h4 id="designThemeTitle"></h4>
            <span class="section-code">SYS.THEME / 01</span>
          </div>
          <div id="designThemeOptions" class="design-theme-options" role="list"></div>
        </section>

        <section class="customize-section">
          <h4 id="languageTitle"></h4>
          <div id="languageOptions" class="segmented-options language-options" role="group"></div>
        </section>

        <section class="customize-section">
          <h4 id="appearanceTitle"></h4>
          <div id="appearanceOptions" class="appearance-options" role="list"></div>
        </section>

        <section class="customize-section">
          <h4 id="themeColorTitle"></h4>
          <div class="theme-color-row">
            <div id="themeColorOptions" class="theme-color-options" role="list"></div>
            <label class="custom-color-control">
              <span id="customThemeColorLabel"></span>
              <input id="themeColorInput" type="color" value="#d8ff3d">
            </label>
          </div>
        </section>

        <section class="customize-section">
          <h4 id="sizeRadiusTitle"></h4>
          <div class="shape-controls">
            <label class="range-control shape-range-control">
              <span id="iconRadiusLabel"></span>
              <output id="iconRadiusValue">8px</output>
              <input id="iconRadiusInput" type="range" min="0" max="25" step="1" value="8">
            </label>
            <div id="iconRadiusQuickOptions" class="quick-options" role="group"></div>
            <label class="range-control shape-range-control">
              <span id="cardRadiusLabel"></span>
              <output id="cardRadiusValue">0px</output>
              <input id="cardRadiusInput" type="range" min="0" max="24" step="1" value="0">
            </label>
            <label class="range-control shape-range-control">
              <span id="panelRadiusLabel"></span>
              <output id="panelRadiusValue">0px</output>
              <input id="panelRadiusInput" type="range" min="0" max="24" step="1" value="0">
            </label>
            <label class="range-control shape-range-control">
              <span id="buttonRadiusLabel"></span>
              <output id="buttonRadiusValue">0px</output>
              <input id="buttonRadiusInput" type="range" min="0" max="24" step="1" value="0">
            </label>
            <label class="range-control shape-range-control">
              <span id="fontScaleLabel"></span>
              <output id="fontScaleValue">100%</output>
              <input id="fontScaleInput" type="range" min="85" max="120" step="1" value="100">
            </label>
            <div class="density-control">
              <span id="cardDensityLabel"></span>
              <div id="cardDensityOptions" class="segmented-options" role="group"></div>
            </div>
          </div>
          <label class="setting-toggle-row shape-corner-toggle" for="cornerAccentsInput">
            <span class="setting-toggle-copy">
              <strong id="cornerAccentsLabel"></strong>
              <small id="cornerAccentsDescription"></small>
            </span>
            <input id="cornerAccentsInput" class="setting-switch" type="checkbox" role="switch">
          </label>
          <div class="shape-preview" aria-live="polite">
            <div class="shape-preview-panel">
              <div class="shape-preview-card">
                <span class="shape-preview-icon">R</span>
                <strong id="shapePreviewCardLabel"></strong>
              </div>
              <button id="shapePreviewButton" class="ghost-button" type="button"></button>
            </div>
          </div>
        </section>

        <section class="customize-section">
          <h4 id="shortcutSettingsTitle"></h4>
          <label class="setting-toggle-row" for="sortShortcutsByUsageInput">
            <span class="setting-toggle-copy">
              <strong id="sortShortcutsByUsageLabel"></strong>
              <small id="sortShortcutsByUsageDescription"></small>
            </span>
            <input id="sortShortcutsByUsageInput" class="setting-switch" type="checkbox" role="switch">
          </label>
        </section>

        <section class="customize-section">
          <div class="customize-section-head">
            <h4 id="appearancePresetTitle"></h4>
            <div class="preset-actions">
              <input id="appearancePresetFileInput" type="file" accept=".json,application/json" hidden>
              <button id="importAppearancePresetBtn" class="ghost-button" type="button"></button>
              <button id="saveAppearancePresetBtn" class="ghost-button" type="button"></button>
              <button id="updateAppearancePresetBtn" class="ghost-button" type="button"></button>
              <button id="exportAppearancePresetBtn" class="ghost-button" type="button"></button>
            </div>
          </div>
          <div id="appearancePresetList" class="appearance-preset-list" role="list"></div>
        </section>

        <section class="customize-section">
          <h4 id="wallpaperTitle"></h4>
          <div id="backgroundGrid" class="wallpaper-grid" role="list"></div>
          <div class="background-tuning">
            <label class="range-control">
              <span id="backgroundOpacityLabel"></span>
              <output id="backgroundOpacityValue">100%</output>
              <input id="backgroundOpacityInput" type="range" min="15" max="100" step="1" value="100">
            </label>
            <label class="range-control">
              <span id="backgroundBlurLabel"></span>
              <output id="backgroundBlurValue">0px</output>
              <input id="backgroundBlurInput" type="range" min="0" max="28" step="1" value="0">
            </label>
            <label class="range-control">
              <span id="panelOpacityLabel"></span>
              <output id="panelOpacityValue">94%</output>
              <input id="panelOpacityInput" type="range" min="10" max="100" step="1" value="94">
            </label>
            <label class="range-control">
              <span id="panelBlurLabel"></span>
              <output id="panelBlurValue">0px</output>
              <input id="panelBlurInput" type="range" min="0" max="36" step="1" value="0">
            </label>
          </div>
          <div class="wallpaper-actions">
            <input id="backgroundFileInput" type="file" accept="image/*" multiple hidden>
            <button id="uploadBackgroundBtn" class="ghost-button" type="button"></button>
            <button id="removeBackgroundBtn" class="ghost-button" type="button"></button>
          </div>
        </section>

        <section class="customize-section data-transfer-section">
          <div class="customize-section-heading">
            <h4 id="dataTransferTitle"></h4>
            <span class="section-code">LOCAL.DATA / 02</span>
          </div>
          <p id="dataTransferCopy" class="preview-copy"></p>
          <input id="dataBackupFileInput" type="file" accept=".json,application/json" hidden>
          <div class="data-transfer-actions">
            <button id="importBookmarksBtn" class="ghost-button" type="button"></button>
            <button id="exportDataBtn" class="ghost-button" type="button"></button>
            <button id="importDataBtn" class="ghost-button" type="button"></button>
          </div>
        </section>

        <section class="customize-section reset-section">
          <h4 id="resetTitle"></h4>
          <p id="resetDescription" class="preview-copy"></p>
          <button id="resetAppearanceBtn" class="danger-button" type="button"></button>
        </section>
      </div>
    </dialog>

    <dialog id="resetAppearanceDialog" class="modal confirm-modal">
      <div class="modal-head">
        <h3 id="resetAppearanceDialogTitle"></h3>
        <button id="closeResetAppearanceDialogBtn" class="icon-button" type="button">×</button>
      </div>
      <p id="resetAppearanceMessage" class="confirm-message"></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="cancelResetAppearanceBtn" class="ghost-button" type="button"></button>
        <button id="confirmResetAppearanceBtn" class="danger-button" type="button"></button>
      </div>
    </dialog>

    <dialog id="feedbackDialog" class="modal feedback-modal">
      <div class="modal-head">
        <div>
          <span class="feedback-code">SYS.PROMPT / ACTION</span>
          <h3 id="feedbackDialogTitle"></h3>
        </div>
        <button id="feedbackCloseBtn" class="icon-button" type="button">×</button>
      </div>
      <p id="feedbackDialogMessage" class="confirm-message"></p>
      <label id="feedbackInputWrap" class="feedback-input-wrap" hidden>
        <span id="feedbackInputLabel"></span>
        <input id="feedbackInput" type="text" maxlength="80">
      </label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="feedbackCancelBtn" class="ghost-button" type="button"></button>
        <button id="feedbackConfirmBtn" class="primary-button" type="button"></button>
      </div>
    </dialog>

    <dialog id="presetImportResultDialog" class="modal preset-import-result-modal">
      <div class="modal-head">
        <h3 id="presetImportResultTitle"></h3>
        <button id="closePresetImportResultBtn" class="icon-button" type="button">×</button>
      </div>
      <p id="presetImportResultMessage" class="preset-import-result-message" role="status"></p>
      <p id="presetImportResultWarning" class="preset-import-result-warning" hidden></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="keepCurrentAppearanceBtn" class="ghost-button" type="button"></button>
        <button id="applyImportedPresetBtn" class="primary-button" type="button"></button>
        <button id="dismissPresetImportResultBtn" class="primary-button" type="button" hidden></button>
      </div>
    </dialog>

    <dialog id="bookmarkImportDialog" class="modal bookmark-import-modal">
      <div class="modal-head">
        <div>
          <span class="feedback-code">LOCAL.BOOKMARKS / READ</span>
          <h3 id="bookmarkImportTitle"></h3>
        </div>
        <button id="closeBookmarkImportBtn" class="icon-button" type="button">×</button>
      </div>
      <p id="bookmarkImportCopy" class="preview-copy"></p>
      <div class="bookmark-import-toolbar">
        <span id="bookmarkImportSummary" role="status"></span>
        <button id="toggleAllBookmarkGroupsBtn" class="ghost-button compact-button" type="button"></button>
      </div>
      <div id="bookmarkImportList" class="bookmark-import-list" role="list"></div>
      <p id="bookmarkImportError" class="form-error" hidden></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="cancelBookmarkImportBtn" class="ghost-button" type="button"></button>
        <button id="confirmBookmarkImportBtn" class="primary-button" type="button"></button>
      </div>
    </dialog>

    <dialog id="shortcutDialog" class="modal">
      <form id="shortcutForm" method="dialog" novalidate>
        <div class="modal-head">
          <h3 id="shortcutDialogTitle"></h3>
          <button class="icon-button close-dialog" type="button" value="cancel">×</button>
        </div>
        <input type="hidden" id="shortcutId">
        <label>

          <input id="shortcutTitleInput" type="text" maxlength="36">
        </label>
        <label>

          <input id="shortcutUrlInput" type="url" placeholder="https://example.com" required>
        </label>
        <label>

          <select id="shortcutCategorySelect" required></select>
        </label>
        <div class="icon-preview-row">
          <div id="shortcutIconPreview" class="shortcut-icon preview-icon">
            <span>?</span>
          </div>
          <div>
            <p id="previewTitle" class="preview-title"></p>
            <p id="previewCopy" class="preview-copy"></p>
          </div>
          <button id="refreshIconBtn" class="ghost-button" type="button"></button>
        </div>
        <label>

          <input id="shortcutColorInput" type="color" value="#62d5ff">
        </label>
        <p id="shortcutError" class="form-error" hidden></p>
        <div class="modal-actions">
          <button id="deleteShortcutBtn" class="danger-button" type="button" hidden></button>
          <span class="spacer"></span>
          <button id="cancelShortcutBtn" class="ghost-button close-dialog" type="button"></button>
          <button id="saveShortcutBtn" class="primary-button" type="submit"></button>
        </div>
      </form>
    </dialog>

    <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="src/core/bookmark-import.js"></script>
    <script src="app.js"></script>
  </body>
</html>
